- type: entity
  abstract: true
  parent: Clothing
  id: ClothingShoesBase
  components:
  - type: FootstepTimbre
    pitch: 1.04
    volume: -1.5
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Starlight/Items/Handling/sneakers_pickup1.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Starlight/Items/Handling/sneakers_drop1.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Starlight/Items/Handling/sneakers_drop1.ogg
  - type: Clothing
    slots:
    - FEET
    equipSound:
      path: /Audio/_Starlight/Items/Equip/sneakers_equip1.ogg
  # Goobstation edit end
  - type: Sprite
    state: icon
  - type: Item
    size: Normal
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
  - type: ProtectedFromStepTriggers
  - type: Armor # provide minimal covering to your feet
    coverage:
    - Foot
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95

- type: entity
  abstract: true
  parent: ClothingShoesBase
  id: ClothingShoesBaseButcherable
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50

# stuff common to all military boots
- type: entity
  abstract: true
  parent: [ClothingShoesBase, ClothingSlotBase]
  id: ClothingShoesMilitaryBase
  components:
  - type: FootstepTimbre
    pitch: 0.9
    volume: 1.5
  - type: Matchbox
  - type: ItemSlots
    slots:
      item:
        name: clothing-boots-sidearm
        priority: 4
        whitelist:
          tags:
          - Knife
          - Sidearm
  # Goobstation
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5
  - type: ModifyStandingUpTime
    multiplier: 0.5
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.1
      OrganDamage: 0.1
      BoneDamage: 0.1
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9

- type: entity
  abstract: true
  id: ClothingShoesBootsSecFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      item:
      - CombatKnife

- type: entity
  abstract: true
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesBaseWinterBoots
  description: Fluffy boots to help survive even the coldest of winters.
  components:
  - type: FootstepTimbre
    pitch: 0.94
    volume: -0.5
  - type: TemperatureProtection
    heatingCoefficient: 1.025
    coolingCoefficient: 0.25

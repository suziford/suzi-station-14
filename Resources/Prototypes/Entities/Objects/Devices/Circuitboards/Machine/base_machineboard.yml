- type: entity
  id: BaseMachineCircuitboard
  parent: BaseItem
  name: machine board
  abstract: true
  suffix: Machine Board
  components:
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_Starlight/Items/Handling/component_pickup.ogg
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_Starlight/Items/Handling/component_drop.ogg
    - type: MachineBoard
    - type: Sprite
      sprite: Objects/Misc/module.rsi
      state: generic
    - type: Item
      storedRotation: -90
    - type: Tag
      tags:
        - DroneUsable # Goobstation
    - type: StaticPrice
      price: 100
    - type: PhysicalComposition #Goobstation - Recycle update
      materialComposition:
        Glass: 125
        Steel: 25
      chemicalComposition:
        Silicon: 20
    - type: Circuitboard

